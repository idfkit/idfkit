[project]
name = "idfkit"
version = "1.0.0rc2"
description = "A fast, modern EnergyPlus IDF/epJSON parser with O(1) lookups and reference tracking"
authors = [{ name = "Samuel Letellier-Duchesne", email = "developers@idfkit.com" }]
readme = "README.md"
keywords = ["energyplus", "idf", "epjson", "parser", "building simulation", "energy modeling"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://py.idfkit.com/"
Repository = "https://github.com/idfkit/idfkit"
Documentation = "https://py.idfkit.com/"

[project.optional-dependencies]
# Core simulation requires no extras
sim = []
# DataFrame result conversion
pandas = ["pandas>=1.5"]
dataframes = ["pandas>=1.5"]  # Alias for backwards compatibility
# Cloud storage backends
# Note: aiobotocore pins a narrow botocore range.  When both s3 and
# async-s3 are installed, the resolver must find a boto3 version whose
# botocore matches aiobotocore's pin.  Modern resolvers (pip, uv)
# handle this automatically.
s3 = ["boto3>=1.26"]
async-s3 = ["aiobotocore>=2.5"]
cloud = ["boto3>=1.26"]  # Alias for s3
# Plotting backends
plot = ["matplotlib>=3.5"]
plotly = ["plotly>=5.0"]
# Built-in tqdm progress bars for simulations
progress = ["tqdm>=4.60"]
# Everything
all = [
    "pandas>=1.5",
    "matplotlib>=3.5",
    "plotly>=5.0",
    "boto3>=1.26",
    "aiobotocore>=2.5",
    "tqdm>=4.60",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pre-commit>=2.20.0",
    "tox-uv>=1.11.3",
    "deptry>=0.23.0",
    "pyright>=1.1.389",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.11.5",
    # No documentation toolchain. The site moved to idfkit/idfkit-developers, which declares its
    # own mkdocs, Material, mkdocstrings and griffe, and pins this library as a dependency rather
    # than containing it.
    "pandas-stubs>=2.0",
    "matplotlib-stubs>=0.2.0",
    "types-boto3[s3]>=1.0.0",
    "types-aiobotocore-s3>=2.5",
    "boto3>=1.26",
    "aiobotocore>=2.5",
    "plotly>=5.0",
    "pyyaml>=6.0.3",
]
benchmark = [
    "eppy>=0.5.63",
    "matplotlib>=3.7.0",
    "opyplus>=2.0.7",
    "energyplus-idd-idf-utilities>=0.88",
    "pyinstrument>=5.0",
    "esoreader>=1.2.3",
]

[project.scripts]
idfkit = "idfkit.compat._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idfkit"]

# Conformance corpus level this release is tested against, as an immutable tag in
# idfkit-conformance. The CI job that checks the corpus out and the release check both read this
# one value, so the declared level and the pinned tag cannot diverge. A gate that finds no level
# declared here must refuse to run rather than fall back to a default.
[tool.idfkit.conformance]
level = "conformance-2026.10"

# Governance artifact level this release is checked against, as an immutable tag in
# idfkit-conformance. Read from this one value by both the CI gate and the release check, for the
# same reason: the declaration and the pin stay a single fact. A gate must refuse to run against a
# copy that declares no level.
[tool.idfkit.governance]
level = "governance-2026.14"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
exclude = [
    "benchmarks", "src/idfkit/schemas", "src/idfkit/weather/data",
    ".venv", "**/node_modules", "**/__pycache__",
    # Generated type stubs — used as stubs by pyright, not analyzed directly
    "src/idfkit/_generated_types.pyi",
    "src/idfkit/document.pyi",
]

# The codegen modules are maintainer tools, not library code. They are never imported by an
# installed package: they produce files that are committed, and `make check` regenerates and
# diffs those files. So they may assume the interpreter a maintainer and CI actually run, 3.11,
# which is what lets generate_conformance.py read pyproject.toml with the standard-library
# tomllib rather than a dependency. The library itself is still analysed at 3.10 by the block
# below, and still supports it. This MUST precede the broader src/idfkit block: pyright uses the
# FIRST matching execution environment.
[[tool.pyright.executionEnvironments]]
root = "src/idfkit/codegen"
pythonVersion = "3.11"
reportTypedDictNotRequiredAccess = false

# IDFDocument uses a TypedDict stub for O(1) __getitem__ type resolution.
# All keys are total=False (the document is not a real TypedDict at runtime),
# so we scope the suppression to the package rather than globally.
[[tool.pyright.executionEnvironments]]
root = "src/idfkit"
reportTypedDictNotRequiredAccess = false

# Three of the four execution environments that stood here described docs/snippets/, which moved to
# idfkit/idfkit-developers with the rest of the site. They went with it: the rules that catch API
# drift in a documented example belong wherever the examples are.
#
# This one stayed, because its subject did. agent_references/snippets/ is the verified code that
# idfkit.codegen.bake_references inlines into the wheel-packaged developing-with-idfkit skill, so
# it is library content that happens to be written as examples. The rules that catch API drift —
# attribute access, call signatures, argument types — stay ON, which is the whole point of routing
# the examples through pyright: an assistant that reads a renamed method out of the bundle invents
# a call that does not exist. What stays OFF is the "unknown type" / "untyped" noise that snippet
# style legitimately provokes.
[[tool.pyright.executionEnvironments]]
root = "agent_references/snippets"
reportTypedDictNotRequiredAccess = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportMissingTypeStubs = false
reportMissingTypeArgument = false
reportMissingModuleSource = false
reportUntypedFunctionDecorator = false
reportUntypedBaseClass = false
reportUnusedVariable = false
reportUnusedExpression = false
reportUnusedFunction = false
reportPossiblyUnboundVariable = false
reportReturnType = false
# Happy-path doc style: examples assume optional accessors are present (e.g.
# result.sql.get_timeseries). Attribute TYPOS on the non-None type are still caught by
# reportAttributeAccessIssue; only the "could be None" noise is silenced. reportAssignmentType is
# off because placeholder reassignment (declare doc: IDFDocument, then doc = load_idf(...))
# provokes false positives.
reportOptionalMemberAccess = false
reportAssignmentType = false
# Reference sections legitimately show "here's the importable API" overview blocks whose symbols
# aren't all exercised. Nonexistent import symbols are still caught by reportAttributeAccessIssue
# ("unknown import symbol"), so turning this off preserves the existence check.
reportUnusedImport = false
# Drift-catching rules deliberately left ON (strict default):
#   reportAttributeAccessIssue, reportCallIssue, reportArgumentType,
#   reportFunctionMemberAccess, reportIndexIssue, reportOptionalSubscript,
#   reportOperatorIssue.

[tool.pytest.ini_options]
testpaths = ["tests", "src/idfkit"]
addopts = "--doctest-modules --ignore=src/idfkit/simulation --ignore=src/idfkit/weather --ignore=src/idfkit/schedules --ignore=src/idfkit/thermal --ignore=src/idfkit/visualization --ignore=src/idfkit/download.py --ignore=src/idfkit/compat"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE"]
markers = [
    "integration: marks tests as requiring EnergyPlus installation (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"benchmarks/*" = ["S603", "S607", "SIM115", "B007", "B905", "S112", "TRY003", "BLE001"]
# The scripts print, and they raise with the long messages that are the whole point: a build that
# stops because the installed library no longer ships a file the site publishes has to say which
# file, why there is no fallback, and what fixes it.
"scripts/*" = ["T201", "TRY003"]
# The agent-reference snippets are documentation examples, written in doc style. They keep the
# lint waivers they had under docs/snippets/, because moving them did not change how they read.
"agent_references/snippets/*" = ["E402", "F706", "F821", "F841", "F811", "I", "S", "B", "TRY", "UP008"]
"src/idfkit/__init__.py" = ["F403"]  # TYPE_CHECKING star import from _generated_types
"src/idfkit/document.pyi" = ["F405"]  # star import from _generated_types
"src/idfkit/_generated_types.pyi" = ["F401"]  # re-exports for document.pyi

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["src"]
