site_name: idfkit
repo_url: https://github.com/idfkit/idfkit
site_url: https://py.idfkit.com/
site_description: A fast, modern EnergyPlus IDF/epJSON toolkit for Python with O(1) lookups, automatic reference tracking, 3D geometry, and simulation support.
site_author: Samuel Letellier-Duchesne
edit_uri: edit/main/docs/
repo_name: idfkit/idfkit
copyright: Maintained by <a href="https://samuelduchesne.github.io">samuelduchesne</a>.

exclude_docs: |
  tape/README.md
  # SKILL.md is the agent/MCP dispatch document (bundled in the wheel); its
  # links are relative to the bundle layout, not the docs site.
  agent-references/SKILL.md
  # Build-time hooks, not pages. They live under docs/ so `hooks:` can find them
  # by a path relative to this file; they must not be copied into the site.
  hooks/

