  - Explanation:
    - explanation/index.md
    - The hazards of a positional format: explanation/positional-format-hazards.md
    - Why field names come from epJSON: explanation/epjson-field-names.md
    # Both generated from the pinned governance tag. They were reachable only by
    # direct link until now, which made a generated page that nothing navigates to.
    - Capability parity: explanation/parity.md
    - The naming map: explanation/naming-map.md
    - How conformance is established: explanation/conformance.md
    - Type-safe development: concepts/type-safety.md
    - Static types generated from the schema: explanation/generated-types.md
    - Why accessors and not a Proxy: explanation/accessors-not-proxies.md
    - Content-addressed schemas: explanation/content-addressed-schemas.md
    - A synchronous core with async edges: explanation/sync-core-async-edge.md
