site_name: idfkit
repo_url: https://github.com/idfkit/idfkit
# One site for both languages (FR-051). Per-language sites, per-language navigation
# sections, and per-language addresses for shared material are prohibited: py.idfkit.com
# and js.idfkit.com redirect here permanently and no longer publish (FR-056).
site_url: https://developers.idfkit.com/
site_description: EnergyPlus IDF and epJSON tooling for Python and TypeScript. One API surface, one vocabulary, one site.
site_author: Samuel Letellier-Duchesne
edit_uri: edit/main/docs/
repo_name: idfkit/idfkit
copyright: Maintained by <a href="https://samuelduchesne.github.io">samuelduchesne</a>.

# FR-059 declares exactly one exception to the four kinds of the Diataxis structure:
# `agent-references/`, the material addressed to automated tooling and shipped inside
# the Python wheel. It is a fifth section by explicit amendment, not by drift. A second
# exception requires amending the specification, not adding a line here, and
# `scripts/check_page_kinds.py` hard-codes this one name so the set cannot widen by
# accident.
exclude_docs: |
  tape/README.md
  # SKILL.md is the agent/MCP dispatch document (bundled in the wheel); its
  # links are relative to the bundle layout, not the docs site.
  agent-references/SKILL.md
  # Build-time hooks, not pages. They live under docs/ so `hooks:` can find them
  # by a path relative to this file; they must not be copied into the site.
  hooks/

nav:
  - Home: index.md

  # Documentation is organised by the Diátaxis framework: Tutorials (learning),
  # How-to guides (tasks), Reference (facts), and Explanation (understanding).
  #
  # ONE navigation for both languages (FR-051). There is deliberately no Python
  # section and no TypeScript section: a page that teaches a task teaches it once,
  # and only the fenced code varies by language (FR-052). A page that applies to one
  # language only is filed by its kind like any other, and says so in its first line
  # rather than being quarantined into a language branch.

  - Tutorials:
    - tutorials/index.md
    - Build your first model: tutorials/first-model.md
    - Core Tutorial: getting-started/core-tutorial.ipynb

  - How-to guides:
    - how-to/index.md
    - Common tasks: getting-started/quick-start.md
    - How to install idfkit: getting-started/installation.md
    - How to migrate from eppy: migration.md
    - Reading and editing models:
      - Collect diagnostics instead of throwing: how-to/collect-diagnostics.md
      - Edit extensible groups: how-to/edit-extensible-groups.md
      - Compare two EnergyPlus versions: how-to/compare-versions.md
    - In the browser:
      - Parse in the browser: how-to/parse-in-the-browser.md
      - Run a simulation in the browser: how-to/run-a-simulation-in-the-browser.md
    - Working with simulations:
      - simulation/index.md
      - Run a simulation: simulation/running.md
      - Run simulations asynchronously: simulation/async.md
      - Access simulation results: simulation/results.md
      - Query SQL output: simulation/sql-queries.md
      - Run batch simulations: simulation/batch.md
      - Track simulation progress: simulation/progress.md
      - Cache simulation results: simulation/caching.md
      - Plot simulation results: simulation/plotting.md
      - Discover output variables: simulation/output-discovery.md
      - Handle simulation errors: simulation/errors.md
      - Migrate models between EnergyPlus versions: simulation/migrating-versions.md
      - Design-day sizing workflow: examples/sizing-workflow.ipynb
      - Run a parametric study: examples/parametric-study.ipynb
    - Weather data:
      - weather/index.md
      - Search for weather stations: weather/station-search.md
      - Download weather files: weather/downloads.md
      - Apply design days: weather/design-days.md
      - Geocode addresses: weather/geocoding.md
      - Warm the weather cache for an offline run: how-to/warm-the-weather-cache.md
    - Evaluate schedules: schedules/index.md
    - Scaling out:
      - Use cloud & remote storage: concepts/cloud-storage.md
      - Store simulation results in S3: examples/cloud-simulations.md
      - Run simulations as Celery tasks: examples/celery-integration.md
      - Run distributed simulations with Scythe: examples/scythe.md
    - Configuring & operating:
      - Configure logging: concepts/logging.md
      - Work across EnergyPlus versions: concepts/version-compatibility.md
    # Troubleshooting pages are how-to guides: each one is a task, taken in order,
    # by a reader who already knows what went wrong (FR-055, T107). They were a
    # top-level section, which made them a fifth kind by accident.
    - Troubleshooting:
      - Common errors: troubleshooting/errors.md
      - EnergyPlus issues: troubleshooting/energyplus.md

  - Reference:
    - reference/index.md
    - Supported EnergyPlus versions: reference/versions.md
    - Slim schema format: reference/slim-schema-format.md
    - Environment Variables: concepts/environment-variables.md
    - "CLI: idfkit tmy": cli/tmy.md
    # Generated from source by each language's own tooling (FR-061). The TypeScript
    # half arrives as a sibling of these subjects when its TypeDoc artefact is
    # published and pinned; it is not a second, language-named branch.
    - API Reference:
      - Core:
        - Document: api/document.md
        - Objects: api/objects.md
        - I/O: api/io.md
        - Schema: api/schema.md
        - Validation: api/validation.md
        - Geometry: api/geometry.md
        - Geometry Builders: api/geometry_builders.md
        - Surface Matching: api/surface_matching.md
        - Zoning: api/zoning.md
        - References: api/references.md
        - Thermal: api/thermal.md
        - Visualization: api/visualization.md
        - Exceptions: api/exceptions.md
        - Versions: api/versions.md
      - Simulation:
        - Overview: api/simulation/index.md
        - Runner: api/simulation/runner.md
        - Async: api/simulation/async.md
        - Preprocessing: api/simulation/expand.md
        - Results: api/simulation/results.md
        - SQL: api/simulation/sql.md
        - ESO / MTR: api/simulation/eso.md
        - Batch: api/simulation/batch.md
        - Cache: api/simulation/cache.md
        - Progress: api/simulation/progress.md
        - Plotting: api/simulation/plotting.md
        - File Systems: api/simulation/fs.md
      - Migration: api/migration.md
      - Schedules:
        - Overview: api/schedules/index.md
      - Weather:
        - Overview: api/weather/index.md
        - Station: api/weather/station.md
