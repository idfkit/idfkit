# Build-time substitution, not a plugin: `parity(id)` resolves against the pinned parity
# ledger and fails the build on an id that does not exist. A macros plugin would make Jinja of
# every `{{ ... }}` on every page, including the code samples; this touches one token.
hooks:
  - docs/hooks/parity_macro.py

plugins:
  - search
  - social
  - meta
  - tags
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          inventories:
            - https://docs.python.org/3/objects.inv
          options:
            # The API pages carry no hand-maintained `members:` allow-lists: they
            # silently dropped names that no longer existed and omitted real ones,
            # so the reference drifted from the code in both directions. Render
            # every public member instead, including dataclass fields documented
            # in a class-level Attributes: block rather than inline.
            filters: ["!^_"]
            show_if_no_docstring: true
  - mkdocs-jupyter:
      include_source: true
      execute: false
      include: ["*.ipynb"]

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/fire

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/idfkit/idfkit
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/idfkit
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
