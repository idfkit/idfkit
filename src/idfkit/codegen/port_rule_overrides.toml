# Reviewed resolutions for idfkit.codegen.generate_port_rules (research R-04, step 5).
#
# The generator reads EnergyPlus's own node connection report and fails while any of three kinds
# of item is unreviewed. Each entry below is one review, with its reason:
#
#   [[rule]]       Replaces every generated rule for (object_type, field). Used where a field's role
#                  differs between models: a value predicate (`when = [field, value]`, compared
#                  case-insensitively, a blank field taking its schema default) or a role that
#                  depends on the surrounding parent. `provenance` stays `eplus_examples` only for
#                  variants EnergyPlus reported; a variant inferred by analogy is `hand_written`.
#   [[accept]]     Accepts the role EnergyPlus reported where the field's name suggests another.
#                  EnergyPlus decides; naming is only the cross-check.
#   [[ambiguous]]  An object used the same node in several fields, so the rows could not be told
#                  apart. Any of those fields EnergyPlus never reported unambiguously keeps a
#                  `hand_written` rule from its name.
#
# Reviewed against the EnergyPlus 26.2 example files.

# ------------------------------------------------------------------------------------------------
# Value predicates: an air-cooled or evaporatively cooled condenser takes outdoor air at its inlet.
# ------------------------------------------------------------------------------------------------

[[rule]]
object_type = "AirConditioner:VariableRefrigerantFlow"
field = "condenser_inlet_node_name"
when = ["condenser_type", "AirCooled"]
connection = "OutsideAir"
stream = 1
fluid = "Air"
provenance = "eplus_examples"
reason = "EnergyPlus reports an OutsideAir reference for air-cooled condensers."

[[rule]]
object_type = "AirConditioner:VariableRefrigerantFlow"
field = "condenser_inlet_node_name"
when = ["condenser_type", "EvaporativelyCooled"]
connection = "OutsideAir"
stream = 1
fluid = "Air"
provenance = "hand_written"
reason = "No example uses it; EnergyPlus treats evaporatively cooled condensers like air-cooled ones."

[[rule]]
object_type = "AirConditioner:VariableRefrigerantFlow"
field = "condenser_inlet_node_name"
when = ["condenser_type", "WaterCooled"]
connection = "Inlet"
stream = 2
fluid = "Water"
provenance = "eplus_examples"
reason = "A water-cooled condenser is a plant demand component on stream 2."

