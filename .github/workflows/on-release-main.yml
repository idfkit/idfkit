name: release-main

on:
  release:
    types: [published]


permissions:
  contents: write
  id-token: write

# The deploy-docs job that stood here is gone. It built the site out of this repository and
# published it to developers.idfkit.com on every release, which after feature 003 would be a second
# place the site can be published from. 003-FR-005 allows exactly one, and it is
# idfkit-developers. The ARCHIVE_ARTIFACT_NAME env this job read went with it; the interlock it
# guarded still exists, in archive-retired-site.yml and deploy-py-redirects.yml, which are about
# py.idfkit.com and stay here.


jobs:

  # THE VERSION IS READ FROM THE MANIFEST, NOT WRITTEN INTO IT.
  #
  # A `set-version` job stood here and patched pyproject.toml from the tag, with
  # `sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/"`. Tags carry the `v` prefix, so it
  # wrote `version = "v1.0.0-rc.5"`. Hatchling normalised the wheel filename and left the raw string
  # in the metadata, which made `idfkit.__version__` equal to `"v1.0.0-rc.5"` and put
  # `!-Generator idfkit vv1.0.0-rc.5` at the top of every file the writer generated (idfkit#212).
  #
  # The patch was redundant as well as wrong. CLAUDE.md requires the field to be bumped in the
  # release commit and to agree with the tag, and `make publish` never patched anything: it builds
  # from the field. Two publish paths produced different metadata from one commit. Now neither
  # patches, and the check below fails the release if the two disagree rather than writing over one.
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: The tag and the declared version must agree
        run: uv run --with packaging python scripts/check_release_version.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

  # Only after `publish` has returned. These two used to be separate workflows on the same
  # `release: published` trigger, which meant they started together: the downstream repositories
  # were told to pin a version PyPI had not been given yet, and all four failed to resolve it.
  # Silently, on three consecutive releases, because the failure lands in repositories nobody
  # watches on a release day. A job dependency is the only thing that orders them.
  notify-downstream:
    needs: [publish]
    uses: ./.github/workflows/notify-downstream.yml
    with:
      idfkit_version: ${{ github.event.release.tag_name }}
    secrets: inherit
