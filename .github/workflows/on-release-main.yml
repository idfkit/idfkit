name: release-main

on:
  release:
    types: [published]


permissions:
  contents: write
  id-token: write

# The deploy-docs job that stood here is gone. It built the site out of this repository and
# published it to developers.idfkit.com on every release, which after feature 003 would be a second
# place the site can be published from. 003-FR-005 allows exactly one, and it is
# idfkit-developers. The ARCHIVE_ARTIFACT_NAME env this job read went with it; the interlock it
# guarded still exists, in archive-retired-site.yml and deploy-py-redirects.yml, which are about
# py.idfkit.com and stay here.


jobs:

  set-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Export tag
        id: vars
        run: echo tag=${GITHUB_REF#refs/*/} >> $GITHUB_OUTPUT
        if: ${{ github.event_name == 'release' }}

      - name: Update project version
        run: |
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        if: ${{ github.event_name == 'release' }}

      - name: Upload updated pyproject.toml
        uses: actions/upload-artifact@v4
        with:
          name: pyproject-toml
          path: pyproject.toml

  publish:
    runs-on: ubuntu-latest
    needs: [set-version]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@v4
        with:
          name: pyproject-toml

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish
