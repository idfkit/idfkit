name: release-main

on:
  release:
    types: [published]


permissions:
  contents: write
  id-token: write

env:
  ARCHIVE_ARTIFACT_NAME: py.idfkit.com-last-full-build


jobs:

  set-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Export tag
        id: vars
        run: echo tag=${GITHUB_REF#refs/*/} >> $GITHUB_OUTPUT
        if: ${{ github.event_name == 'release' }}

      - name: Update project version
        run: |
          sed -i "s/^version = \".*\"/version = \"$RELEASE_VERSION\"/" pyproject.toml
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        if: ${{ github.event_name == 'release' }}

      - name: Upload updated pyproject.toml
        uses: actions/upload-artifact@v4
        with:
          name: pyproject-toml
          path: pyproject.toml

  publish:
    runs-on: ubuntu-latest
    needs: [set-version]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Download updated pyproject.toml
        uses: actions/download-artifact@v4
        with:
          name: pyproject-toml

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish


  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Require the retained last full build of py.idfkit.com
        # Same guard, same reason, as deploy-docs.yml. This deploy also uses force_orphan, so it
        # also replaces gh-pages with a single commit whose history does not contain the tree it
        # replaced. Publishing a release before archive-retired-site has run would destroy the last
        # full build of py.idfkit.com with no way back (FR-090).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          live=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARCHIVE_ARTIFACT_NAME}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [ "${live}" = "0" ]; then
            echo "::error::No unexpired '${ARCHIVE_ARTIFACT_NAME}' artefact exists. This deploy"
            echo "::error::orphans gh-pages, which still holds the last full build of"
            echo "::error::py.idfkit.com, and that build cannot be rebuilt from current sources."
            echo "::error::Run the archive-retired-site workflow first (FR-090)."
            exit 1
          fi
          echo "${live} unexpired copy or copies of ${ARCHIVE_ARTIFACT_NAME} are retained."

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Set up the parity ledger
        # The site cannot be built without it: docs/hooks/parity_macro.py reads the ledger out of
        # idfkit-conformance at the pinned governance tag and aborts the build rather than render a
        # page with its parity statements missing (FR-084). Same step as deploy-docs.yml.
        uses: ./.github/actions/setup-parity-ledger

      - name: Install Cairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2

      - name: Build documentation
        run: ./scripts/build_docs.sh

      - name: Preserve PR previews from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          if git show gh-pages:pr-preview >/dev/null 2>&1; then
            git worktree add --detach gh-pages-ref gh-pages
            cp -r gh-pages-ref/pr-preview site/pr-preview
            git worktree remove gh-pages-ref
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          cname: developers.idfkit.com
