name: benchmark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/commit to benchmark (default: triggering ref)"
        type: string
        default: ""
      runs:
        description: "Number of parallel benchmark runs to take the median over"
        type: string
        default: "5"

permissions:
  contents: read

jobs:
  setup:
    name: setup
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      ref: ${{ steps.build.outputs.ref }}
      release_tag: ${{ steps.build.outputs.release_tag }}
    steps:
      - name: Build matrix and resolve ref
        id: build
        env:
          RUNS: ${{ inputs.runs || 5 }}
          INPUT_REF: ${{ inputs.ref }}
          TRIGGER_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          matrix=$(python3 -c "import json, os; print(json.dumps(list(range(1, int(os.environ['RUNS']) + 1))))")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          ref="$INPUT_REF"
          if [ -z "$ref" ]; then ref="$TRIGGER_REF"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          # A tag ref means the charts belong on that release, whether the run came
          # from the release event or from a manual dispatch against the same tag.
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            case "$ref" in
              refs/tags/*) tag="${ref#refs/tags/}" ;;
              v[0-9]*)     tag="$ref" ;;
              *)           tag="" ;;
            esac
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Will run $RUNS parallel benchmark jobs against $ref"
          if [ -n "$tag" ]; then
            echo "Charts will be attached to release $tag if one is published"
          else
            echo "$ref is not a tag; charts stay an artifact only"
          fi

  bench:
    name: bench (run ${{ matrix.run }})
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: ./.github/actions/setup-python-env

      - name: Install benchmark deps
        run: uv sync --frozen --group benchmark

      - name: Run benchmark
        run: uv run --group benchmark python benchmarks/bench.py

      - uses: actions/upload-artifact@v4
        with:
          name: results-run-${{ matrix.run }}
          path: benchmarks/results.json
          if-no-files-found: error

  aggregate:
    name: aggregate
    needs: [setup, bench]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # needed to upload to the triggering release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: ./.github/actions/setup-python-env

      - name: Install benchmark deps
        run: uv sync --frozen --group benchmark

      - uses: actions/download-artifact@v4
        with:
          path: per-run
          pattern: results-run-*

      - name: Aggregate runs (median of N)
        run: uv run --group benchmark python benchmarks/aggregate.py per-run/

      - name: Show aggregated README diff
        run: |
          echo "::group::Aggregated README perf claim"
          grep -nE "looking up a single object by name" README.md || true
          echo "::endgroup::"
          echo "::group::Generated charts"
          ls -l benchmarks/assets/
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results.json
            benchmarks/assets/benchmark*.svg
            README.md
          if-no-files-found: error

      - name: Attach to release
        if: needs.setup.outputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No published release for tag $TAG; leaving the charts as an artifact."
            exit 0
          fi
          gh release upload "$TAG" \
            benchmarks/results.json \
            benchmarks/assets/benchmark*.svg \
            --clobber
