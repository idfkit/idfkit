name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # The maintainer tools make check runs read TOML with tomllib (Python 3.11+). Pyright
      # still checks the library against Python 3.10 (pythonVersion in pyproject.toml).
      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Run checks
        run: make check
  tests-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run python -m pytest tests --cov --cov-config=pyproject.toml --cov-report=xml

      - name: Check typing
        run: uv run pyright src/


      - name: Upload coverage reports to Codecov with GitHub Action on Python 3.13
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.13' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tests-free-threaded:
    # The suite on free-threaded CPython with the GIL off. The core is pure Python and declares
    # the Free Threading classifier on the strength of this job, and tests/test_thread_safety.py
    # reproduces races only here: on a GIL build most of them cannot happen.
    name: "tests (3.14t, GIL off)"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14t"

      # A `3.14t` request that resolved to a GIL build would pass every test below while proving
      # nothing, so fail loudly first. The import check runs WITHOUT PYTHON_GIL=0: an interpreter
      # re-enables the GIL when it imports an extension module that does not declare support, and
      # that override would hide such a module. idfkit and all of its sub-packages must keep it
      # off on their own.
      - name: Check the interpreter is free-threaded and idfkit keeps the GIL off
        run: |
          uv run python - <<'EOF'
          import importlib, pkgutil, sys, sysconfig
          assert sysconfig.get_config_var("Py_GIL_DISABLED"), f"not a free-threaded build: {sys.version}"
          import idfkit
          for mod in pkgutil.walk_packages(idfkit.__path__, "idfkit."):
              if ".codegen" not in mod.name:
                  importlib.import_module(mod.name)
          assert not sys._is_gil_enabled(), "importing idfkit re-enabled the GIL"
          print(sys.version, "- GIL off after importing every idfkit module")
          EOF

      # PYTHON_GIL=0 because the locked pandas (2.3) re-enables the GIL at import; pandas 3 does
      # not. The override keeps the whole run, the pandas tests included, genuinely GIL-free.
      - name: Run tests
        env:
          PYTHON_GIL: "0"
        run: uv run python -m pytest -W error::DeprecationWarning

  example-sweep:
    # Read every EnergyPlus example file, for every version idfkit bundles a schema for.
    #
    # The other jobs read hand-written fixtures. That catches a parser wrong everywhere and misses
    # one wrong on a schema nobody tested against, which is most of them: idfkit ships eighteen,
    # and field lists, extensible groups and sentinel spellings all moved between releases.
    #
    # Two classes of defect are only reachable this way, and running it by hand found both. A
    # parser change safe on the newest schema and wrong on an older one. And a file whose content
    # belongs to one version while its Version object declares another, which EnergyPlus ships
    # several of: UnitarySystem_VSCoolingCoil_2.idf is in the 25.2 release declaring Version 24.2
    # and using a field added in 25.2, so every value after it lands one field early.
    #
    # NO ENERGYPLUS INSTALL. It does not need one: idfkit parses against its own bundled schemas,
    # so the only thing wanted from a release is its example files. A blobless, shallow, sparse
    # clone of testfiles/*.idf is about 210 MB against roughly a gigabyte for a full install, and
    # it is cached on the release tag, which is immutable, so a hit is permanent. Eighteen
    # downloads happen once, not on every pull request.
    name: "E+ ${{ matrix.version }}"
    runs-on: ubuntu-latest
    strategy:
      # Every version reports for itself. One release failing must not cancel the sixteen that
      # would have told you whether the problem is that release or the change under test.
      fail-fast: false
      matrix:
        # The eighteen versions idfkit bundles a schema for. A test holds this list to
        # `idfkit.versions.ENERGYPLUS_VERSIONS`, because a version added there and not here ships a
        # schema nothing has ever read a real file against.
        #
        # `findings` is that version's MEASURED count, not a round number, so a regression of one
        # is caught. They are not all equal, and the differences are real rather than noise:
        #
        #   three everywhere        two parametric-preprocessor files holding `=$insDepth` where a
        #                           number goes, which is not a number until that preprocessor runs
        #   22.2.0, thirteen        plus eight uses of `Output:Table:ReportPeriod` and one of
        #                           `Chiller:Electric:ASHRAE205` in files declaring a version whose
        #                           schema has neither, and two fields misaligned by a stale stamp
        #   25.2.0, eight           plus UnitarySystem_VSCoolingCoil_2.idf, which declares
        #                           Version 24.2 while using a field added in 25.2
        #   24.1.0, four            plus one of the same shape
        #
        # These numbers are IDENTICAL to the TypeScript library's, version for version, and that is
        # the point: the two sweep the same files and any number that moves on one side alone is a
        # divergence.
        #
        # `errors` is that version's MEASURED count of files that fail to read at all, and it is
        # zero on every version. It was three until issue #185 was fixed: the same three files whose
        # Version object is placed where the detector did not look. Zero is held so that the first
        # unreadable file fails the job.
        include:
          - { version: "8.9.0", findings: 3, errors: 0 }
          - { version: "9.0.1", findings: 3, errors: 0 }
          - { version: "9.1.0", findings: 3, errors: 0 }
          - { version: "9.2.0", findings: 3, errors: 0 }
          - { version: "9.3.0", findings: 3, errors: 0 }
          - { version: "9.4.0", findings: 3, errors: 0 }
          - { version: "9.5.0", findings: 3, errors: 0 }
          - { version: "9.6.0", findings: 3, errors: 0 }
          - { version: "22.1.0", findings: 3, errors: 0 }
          - { version: "22.2.0", findings: 13, errors: 0 }
          - { version: "23.1.0", findings: 3, errors: 0 }
          - { version: "23.2.0", findings: 3, errors: 0 }
          - { version: "24.1.0", findings: 4, errors: 0 }
          - { version: "24.2.0", findings: 3, errors: 0 }
          - { version: "25.1.0", findings: 3, errors: 0 }
          - { version: "25.2.0", findings: 8, errors: 0 }
          - { version: "26.1.0", findings: 3, errors: 0 }
          - { version: "26.2.0", findings: 3, errors: 0 }
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Cache the example files
        id: cache-examples
        uses: actions/cache@v4
        with:
          path: ep/testfiles
          # The hash of the sparse file is in the key, so changing what is swept changes the key.
          # Keying on the tag alone served a stale selection when the exclusion below was added.
          key: ep-testfiles-v${{ matrix.version }}-${{ hashFiles('.github/ep-testfiles.sparse') }}

      - name: Fetch the example files for this release
        if: steps.cache-examples.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # NREL/EnergyPlus redirects here since the rename. The canonical name is used so that the
          # redirect being dropped some day is a loud failure rather than a silent one.
          REPO=https://github.com/NatLabRockies/EnergyPlus

          # --filter=blob:none fetches no file contents until checkout and --depth 1 no history;
          # the sparse pattern then pulls only the IDF files. The three together are the difference
          # between 210 MB and a full clone of a very large repository.
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "v${{ matrix.version }}" "$REPO" ep
          cd ep
          # The selection lives in .github/ep-testfiles.sparse, which the cache key hashes, so the
          # two cannot disagree about what should be present.
          mapfile -t PATTERNS < <(grep -vE '^[[:space:]]*(#|$)' "$GITHUB_WORKSPACE/.github/ep-testfiles.sparse")
          git sparse-checkout set --no-cone "${PATTERNS[@]}"
          git checkout

      - name: Fail if the example files were not found
        run: |
          # An empty sweep passes every threshold while proving nothing. The script refuses an
          # empty directory too; this says so earlier and more plainly.
          count=$(find ep/testfiles -maxdepth 1 -name '*.idf' | wc -l)
          echo "found $count example files for ${{ matrix.version }}"
          test "$count" -gt 0 \
            || (echo "::error::no example files at v${{ matrix.version }}; the sweep proved nothing" && exit 1)

      - name: Read every file
        run: |
          uv run python scripts/sweep_example_files.py ep/testfiles \
            --max-findings ${{ matrix.findings }} --max-errors ${{ matrix.errors }}
