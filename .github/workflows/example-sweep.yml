# Read every EnergyPlus example file, for every version idfkit bundles a schema for.
#
# WHY THIS IS SEPARATE FROM main.yml
#
# The unit suite reads a handful of hand-written fixtures. That catches a parser that is wrong
# everywhere and misses one that is wrong on a schema nobody tested against, which is most of them:
# idfkit ships seventeen, and field lists, extensible groups and sentinel spellings all moved
# between them.
#
# Two classes of defect are only reachable this way. A parser change that is safe on the newest
# schema and wrong on an older one, and a file whose content belongs to one version while its
# `Version` object declares another. EnergyPlus ships several of the second kind, and they were
# found by exactly this sweep: `UnitarySystem_VSCoolingCoil_2.idf` in the 25.2 release declares
# `Version, 24.2` and uses a field added in 25.2, so every value after it lands one field early.
#
# WHY IT DOES NOT INSTALL ENERGYPLUS
#
# It does not need to. idfkit parses against its OWN bundled schemas, so the only thing wanted from
# a release is its example files. A full install is roughly 1 GB per version and seventeen of them
# would be absurd; a blobless, shallow, sparse clone of `testfiles/*.idf` is about 210 MB and takes
# a second. Nothing here runs the simulation engine.
#
# WHY WEEKLY AND NOT PER PUSH
#
# Seventeen clones is real bandwidth for a check whose input changes only when NatLabRockies cuts a
# release. Weekly catches drift, and `workflow_dispatch` covers the case where somebody has just
# touched the parser and wants to know now.
name: example sweep

on:
  schedule:
    # Mondays, early. No relationship to any release cadence; it just wants to be off-peak.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      max_findings:
        description: "Fail a version reporting more diagnostics than this"
        default: "10"
      max_errors:
        description: "Fail a version where more files than this fail to read"
        default: "5"

permissions:
  contents: read

concurrency:
  group: example-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: "E+ ${{ matrix.version }}"
    runs-on: ubuntu-latest
    strategy:
      # Every version reports for itself. One release failing must not cancel the sixteen that
      # would have told you whether the problem is that release or the change under test.
      fail-fast: false
      matrix:
        # The seventeen versions idfkit bundles a schema for, from
        # `idfkit.versions.ENERGYPLUS_VERSIONS`. A version added there without being added here
        # ships a schema nothing has ever read a real file against.
        version:
          - "8.9.0"
          - "9.0.1"
          - "9.1.0"
          - "9.2.0"
          - "9.3.0"
          - "9.4.0"
          - "9.5.0"
          - "9.6.0"
          - "22.1.0"
          - "22.2.0"
          - "23.1.0"
          - "23.2.0"
          - "24.1.0"
          - "24.2.0"
          - "25.1.0"
          - "25.2.0"
          - "26.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      - name: Fetch the example files for this release
        run: |
          set -euo pipefail
          # NREL/EnergyPlus redirects here since the rename; the canonical name is used so that a
          # future redirect being dropped is a loud failure rather than a silent one.
          REPO=https://github.com/NatLabRockies/EnergyPlus

          # --filter=blob:none fetches no file contents until checkout, --depth 1 fetches no
          # history, and the sparse pattern then pulls only the IDF files. The three together are
          # the difference between 210 MB and a full clone of a very large repository.
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "v${{ matrix.version }}" "$REPO" ep
          cd ep
          git sparse-checkout set --no-cone 'testfiles/*.idf'
          git checkout

      - name: Fail if the example files were not found
        run: |
          # An empty sweep passes every threshold while proving nothing. The script refuses an
          # empty directory too; this says so earlier and more plainly.
          count=$(find ep/testfiles -maxdepth 1 -name '*.idf' | wc -l)
          echo "found $count example files for ${{ matrix.version }}"
          test "$count" -gt 0 \
            || (echo "::error::no example files at v${{ matrix.version }}; the sweep proved nothing" && exit 1)

      - name: Read every file
        run: |
          uv run python scripts/sweep_example_files.py ep/testfiles \
            --max-findings "${{ github.event.inputs.max_findings || 10 }}" \
            --max-errors "${{ github.event.inputs.max_errors || 5 }}" \
            | tee sweep.txt

      - name: Summarise
        if: always()
        run: |
          {
            echo "### EnergyPlus ${{ matrix.version }}"
            echo '```'
            head -20 sweep.txt 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
