name: Notify downstream idfkit users

# Offer a newly published version to every project that consumes this library, in the order the
# consumer register gives, and say exactly where that stopped.
#
# NOT TRIGGERED BY `release: published`, and that is the whole point. It used to be, alongside
# on-release-main.yml, which meant the two started together and raced: the dispatch reached the
# downstream repositories, they ran `uv lock` against a pin whose version PyPI had not yet been
# given, and every one of them failed with "no version of idfkit==X". It failed silently on three
# consecutive releases, because a failure here is a red run in a repository nobody was watching,
# and the documentation site sat four versions behind while its pages described an API that had
# moved.
#
# It is now called by on-release-main.yml with `needs: [publish]`, so it cannot start until the
# publish step has returned. `workflow_dispatch` stays for re-running one by hand.
#
# WHAT FEATURE 004 CHANGED, and why each change is a correction rather than a new system:
#
#   - THE ROSTER IS THE CONSUMER REGISTER, not a heredoc here. `DOWNSTREAM_REPOS` listed four
#     repositories, was readable by no gate and visible to one language, and was already missing the
#     two that hand this library to a person: idfkit-mcp-deployment and idfkit-plugin. The roster is
#     now `governance/consumers.toml` in idfkit-conformance, read at the governance tag this library
#     already pins in `[tool.idfkit.governance] level`, never at a branch.
#   - A DISPATCH THAT DOES NOT LAND FAILS THE JOB. The loop used to end
#     `|| echo "Skipping $repo: no bump-idfkit.yml or insufficient permissions"`, so a repository that
#     never received the bump printed the same line as one that did. That line is gone.
#   - DISPATCH IS IN WAVES. Consumers that resolve idfkit directly go first; a consumer that reaches
#     it through another (the hosted deployment and the plugin, behind idfkit-mcp) goes only after its
#     provider's bump concluded, and is rejected, naming the provider, while that provider has
#     published no release on the new level. A failure stops what is behind it, never its siblings.
#   - THE REPORT SAYS WHERE IT STOPPED. It is uploaded as `adoption-report`, and written to the run's
#     summary. The register holds the roster, never the state of a run.
#
# None of this waits on idfkit-js. The two libraries release independently and lockstep between them
# is prohibited; idfkit-js has its own notify-downstream.yml for its own consumers.
#
# The wave logic lives in idfkit-conformance's tools/dispatch_waves.py, read from the same pinned tag
# as the register, so the roster and the rules that walk it cannot come from two versions.
on:
  workflow_call:
    inputs:
      idfkit_version:
        required: true
        type: string
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      idfkit_version:
        description: The released idfkit version to announce, with or without a leading v.
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Each wave waits up to an hour for its bump workflows to conclude.
    timeout-minutes: 150
    env:
      RAW_VERSION: ${{ inputs.idfkit_version }}
    steps:
      - name: Normalize version (strip v prefix)
        id: ver
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Normalized version: $version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.9'

      - name: Wait until the index actually serves the version
        env:
          IDFKIT_VERSION: ${{ steps.ver.outputs.version }}
        # `needs: [publish]` fixes the ORDER; this fixes the LAG. `uv publish` returning means the
        # file was accepted, not that the index is serving it, and the downstream repositories
        # resolve against the index rather than against the upload.
        #
        # The probe is the downstream operation itself: a throwaway project pinning the same
        # version, resolved with the same tool. Anything cheaper would be testing something other
        # than what is about to be asked of every consumer.
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          cat > "$probe/pyproject.toml" <<EOF
          [project]
          name = "downstream-probe"
          version = "0.0.0"
          requires-python = ">=3.10"
          dependencies = ["idfkit==$IDFKIT_VERSION"]
          EOF

          for attempt in $(seq 1 30); do
            if (cd "$probe" && uv lock --quiet >/dev/null 2>&1); then
              echo "Index serves idfkit==$IDFKIT_VERSION (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: not resolvable yet, waiting 10s."
            sleep 10
          done

          echo "::error::idfkit==$IDFKIT_VERSION is still not resolvable after five minutes." \
               "Downstream bumps would fail, so this stops rather than dispatching them."
          exit 1

      - name: Check out this repository for its governance pin
        uses: actions/checkout@v4
        with:
          path: library
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the pinned governance level
        id: pin
        run: |
          set -euo pipefail
          level=$(python3 -c 'import tomllib;print(tomllib.load(open("library/pyproject.toml","rb"))["tool"]["idfkit"]["governance"]["level"])')
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Reading the consumer register at $level."

      - name: Read the consumer register at that tag
        uses: actions/checkout@v4
        with:
          repository: idfkit/idfkit-conformance
          ref: refs/tags/${{ steps.pin.outputs.level }}
          path: conformance
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dispatch in waves
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IDFKIT_VERSION: ${{ steps.ver.outputs.version }}
        run: >-
          python conformance/tools/dispatch_waves.py
          --register conformance/governance/consumers.toml
          --library python
          --level "$IDFKIT_VERSION"
          --report adoption-report.json

      - name: Keep the adoption report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adoption-report
          path: adoption-report.json
          if-no-files-found: ignore
